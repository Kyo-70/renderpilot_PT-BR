[package]
name = "renderpilot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line entry point for RenderPilot."

[lints]
workspace = true

[dependencies]
renderpilot-orchestration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lib]
path = "src/lib.rs"

[dev-dependencies]
hex = { workspace = true }
renderpilot-storage-sqlite = { workspace = true, features = ["test-instrumentation"] }
sha2 = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "renderpilot"
path = "src/main.rs"
