[package]
name = "renderpilot-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite storage adapter boundary for RenderPilot."
build = "build.rs"

[lints]
workspace = true

[features]
test-instrumentation = []

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
base64 = "0.23"
log = "0.4"
renderpilot-application = { path = "../renderpilot-application" }
renderpilot-domain = { path = "../renderpilot-domain" }
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks"] }
serde = "1"
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
renderpilot-detection = { path = "../renderpilot-detection" }
tempfile = "3"

[lib]
path = "src/lib.rs"
