[package]
name = "renderpilot-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows platform adapter boundary for RenderPilot."

[lints]
workspace = true

[dependencies]
renderpilot-application = { workspace = true }
renderpilot-detection = { workspace = true }
renderpilot-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
quick-xml = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows = { workspace = true, features = ["ApplicationModel", "Management_Deployment", "Storage_Search"] }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
path = "src/lib.rs"
